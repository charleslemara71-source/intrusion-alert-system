<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Intrusion Alert System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
    <canvas id="network-bg"></canvas>

    <div class="login-card">
        <a class="brand mb-3" th:href="@{/}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
            Intrusion Alert System
        </a>
        <p class="muted">Sign in to monitor your systems</p>

        <div th:if="${param.error}" class="alert alert-danger py-2">Wrong username or password.</div>
        <div th:if="${param.logout}" class="alert alert-success py-2">You have been signed out.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" type="text" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password" name="password" required>
            </div>
            <button class="btn btn-glow w-100" type="submit">Sign in</button>
        </form>
    </div>

    <script th:src="@{/js/network-bg.js}"></script>
</body>
</html>
