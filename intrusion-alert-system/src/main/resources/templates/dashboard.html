<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Intrusion Alert System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">

<body class="app-body">
    <canvas id="network-bg"></canvas>

    <nav class="topbar">
       <span class="d-flex align-items-center">
    <span class="brand">Intrusion Alert System</span>
    <span class="live-badge"><span class="live-dot"></span>LIVE</span>
</span>
        <div class="d-flex align-items-center gap-3">
            <span class="muted small" id="last-updated"></span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-outline-light btn-sm" type="submit">Sign out</button>
            </form>
        </div>
    </nav>

    <main class="container py-4">

        <div class="row g-3 mb-4">
            <div class="col-6 col-md"><div class="stat-card"><div class="stat-label">Total alerts</div><div class="stat-value" id="stat-total">0</div></div></div>
            <div class="col-6 col-md"><div class="stat-card critical"><div class="stat-label">Critical</div><div class="stat-value" id="stat-critical">0</div></div></div>
            <div class="col-6 col-md"><div class="stat-card high"><div class="stat-label">High</div><div class="stat-value" id="stat-high">0</div></div></div>
            <div class="col-6 col-md"><div class="stat-card medium"><div class="stat-label">Medium</div><div class="stat-value" id="stat-medium">0</div></div></div>
            <div class="col-6 col-md"><div class="stat-card low"><div class="stat-label">Low</div><div class="stat-value" id="stat-low">0</div></div></div>
        </div>

        <div class="panel">
            <h2 class="panel-title">Live alerts</h2>
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Last seen</th>
                            <th>Severity</th>
                            <th>Alert</th>
                            <th>Source IP</th>
                            <th>Account</th>
                            <th>Events</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="alert-rows"></tbody>
                </table>
            </div>
        </div>
    </main>
    
        <script th:src="@{/js/network-bg.js}"></script>
    <script th:src="@{/js/dashboard.js}"></script>
</body>

   <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
