spring.application.name=zuvo
server.port=8080

# Loads src/main/resources/application-local.properties (your private keys, ignored by Git)
spring.profiles.active=local

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/zuvo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ---------- JSON / sessions ----------
spring.jackson.serialization.write-dates-as-timestamps=false
server.servlet.session.timeout=7d
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# ---------- Email (Gmail SMTP) ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Cloudinary ----------
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=

# ---------- Moderation API ----------
moderation.api-key=

# ---------- LiveKit ----------
livekit.url=
livekit.api-key=
livekit.api-secret=

# ---------- Zuvo ----------
# true = also print the 5-digit code in the Eclipse console (handy while testing). Set false for real use.
zuvo.dev-log-codes=true
