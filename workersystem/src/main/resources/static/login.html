<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FarmTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">

    <aside class="auth-side">
      <h2>🌾 Welcome back</h2>
      <p>Log in to view your section, your records and your tasks.</p>
      <ul>
        <li>✅ Quick and secure sign-in</li>
        <li>✅ Dashboard based on your role</li>
      </ul>
    </aside>

    <main class="auth-main">
      <div class="card">
        <h1>Log in</h1>
        <p class="subtitle">Enter your email and password</p>

        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input type="password" id="password" placeholder="Your password" required>
              <button type="button" class="toggle-pw" id="togglePw" title="Show or hide password">👁️</button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log in</button>
          <div id="message" class="message"></div>
        </form>

        <p class="switch-text">New here? <a href="register.html">Create an account</a></p>
      </div>
    </main>

  </div>
  <script src="js/login.js"></script>
</body>
</html>
