<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - FarmTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">

    <aside class="auth-side">
      <h2>🌾 Join the farm team</h2>
      <p>Create your account and become part of the FarmTrack system.</p>
      <ul>
        <li>✅ Your details are saved instantly</li>
        <li>✅ Access matched to your role</li>
        <li>✅ Passwords stored securely</li>
      </ul>
    </aside>

    <main class="auth-main">
      <div class="card">
        <h1>Create account</h1>
        <p class="subtitle">Fill in your details to register</p>

        <form id="registerForm">
          <div class="field">
            <label for="name">Full name</label>
            <input type="text" id="name" placeholder="e.g. Jane Wanjiru" required>
          </div>

          <div class="row">
            <div class="field">
              <label for="idNumber">ID number</label>
              <input type="text" id="idNumber" placeholder="e.g. 12345678" required>
            </div>
            <div class="field">
              <label for="section">Section</label>
              <input type="text" id="section" list="sections" placeholder="e.g. Dairy">
              <datalist id="sections">
                <option value="Dairy">
                <option value="Crops">
                <option value="Poultry">
                <option value="Livestock">
              </datalist>
            </div>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>

          <div class="field">
            <label for="role">Role</label>
            <select id="role" required>
              <option value="WORKER">Worker</option>
              <option value="SECTION_LEADER">Section Leader</option>
              <option value="MANAGER">Manager</option>
              <option value="ASSISTANT_MANAGER">Assistant Manager</option>
              <option value="SECRETARY">Secretary</option>
              <option value="TREASURER">Treasurer</option>
            </select>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input type="password" id="password" minlength="6" placeholder="At least 6 characters" required>
              <button type="button" class="toggle-pw" id="togglePw" title="Show or hide password">👁️</button>
            </div>
            <div class="strength"><div class="strength-bar" id="strengthBar"></div></div>
            <div class="strength-text" id="strengthText"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Register</button>
          <div id="message" class="message"></div>
        </form>

        <p class="switch-text">Already registered? <a href="login.html">Log in</a></p>
      </div>
    </main>

  </div>
  <script src="js/register.js"></script>
</body>
</html>
